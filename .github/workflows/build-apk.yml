name: Build Kauthar School APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web
        run: npm run build || echo "skip web build"

      - name: Capacitor sync
        run: npx cap sync android || echo "skip cap sync"

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: |
          chmod +x android/gradlew || true
          chmod +x gradlew || true

      - name: Build APK
        run: |
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace
        # لو مشروعك ما بيه مجلد android، استخدم السطر التالي بدلا من اللي فوقه:
        # ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kauthar-School-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
